<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270" role="img" aria-labelledby="t d">
  <title id="t">Raw Sorter workflow</title><desc id="d">Five sequential stages animate from folder selection to an optional undo operation.</desc>
  <rect width="1100" height="270" rx="16" fill="#10161e"/>
  <path d="M100 130H1000" stroke="#2b3c4b" stroke-width="3"/>
  <g font-family="Consolas,monospace" text-anchor="middle">
    <g fill="#dff8ff" font-size="13"><text x="100" y="83">01 SELECT</text><text x="300" y="83">02 SCAN</text><text x="500" y="83">03 REVIEW</text><text x="700" y="83">04 MOVE</text><text x="900" y="83">05 UNDO*</text></g>
    <g fill="#7890a0" font-size="11"><text x="100" y="183">folder path</text><text x="300" y="183">extension map</text><text x="500" y="183">counts + sizes</text><text x="700" y="183">QThread jobs</text><text x="900" y="183">reverse moves</text></g>
  </g>
  <g fill="#132a35" stroke="#55d6ff" stroke-width="2">
    <circle cx="100" cy="130" r="17"/><circle cx="300" cy="130" r="17"/><circle cx="500" cy="130" r="17"/><circle cx="700" cy="130" r="17"/><circle cx="900" cy="130" r="17"/>
  </g>
  <g fill="#78e6ff" font-family="Consolas,monospace" font-size="12" text-anchor="middle"><text x="100" y="134">A</text><text x="300" y="134">B</text><text x="500" y="134">C</text><text x="700" y="134">D</text><text x="900" y="134">E</text></g>
  <circle cx="100" cy="130" r="5" fill="#fff"><animate attributeName="cx" values="100;300;500;700;900;100" dur="7s" repeatCount="indefinite"/></circle>
  <text x="550" y="232" text-anchor="middle" fill="#526575" font-family="Consolas,monospace" font-size="11">* available after a completed organize run</text>
</svg>
